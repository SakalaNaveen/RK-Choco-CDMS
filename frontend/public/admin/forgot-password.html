
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4b241b">

  <title>RK Choco | Forgot Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      font-family: Arial, Helvetica, sans-serif;
      color: #352019;
      background:
        radial-gradient(circle at top left, #f5dfc6 0, transparent 38%),
        linear-gradient(135deg, #fff9f1, #f0e0d0);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      border: 1px solid #ead9cc;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(75, 36, 27, 0.13);
    }

    .brand-mark {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, #75402d, #482219);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    h1 {
      margin: 0;
      color: #4b241b;
      text-align: center;
      font-size: 28px;
    }

    .brand-subtitle {
      margin: 9px 0 30px;
      color: #897267;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 25px;
      color: #817168;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #493127;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 13px 14px;
      border: 1px solid #dfcfc3;
      border-radius: 10px;
      outline: none;
      background: #fffdfa;
      color: #352019;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #75402d;
      box-shadow: 0 0 0 3px rgba(117, 64, 45, 0.1);
    }

    .submit-button {
      width: 100%;
      min-height: 49px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #75402d, #482219);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.93;
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      color: #216c3b;
      background: #edf9f0;
      border: 1px solid #c6e9cf;
    }

    .message.error {
      display: block;
      color: #a32626;
      background: #fff0ee;
      border: 1px solid #f2c7c1;
    }

    .back-link {
      display: block;
      margin-top: 24px;
      color: #75402d;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .footer {
      margin: 25px 0 0;
      color: #958276;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand-mark">RK</div>

    <h1>RK Choco</h1>
    <p class="brand-subtitle">PREMIUM CHOCOLATE DISTRIBUTOR</p>

    <h2>Forgot Password?</h2>

    <p class="description">
      Enter the email address associated with your admin account.
      If the account is eligible, a password reset link will be sent to your email.
    </p>

    <form id="forgotForm">
      <label for="email">Admin Email Address</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your admin email"
        autocomplete="email"
        required
      >

      <button
        type="submit"
        id="sendResetButton"
        class="submit-button"
      >
        Send Reset Link
      </button>
    </form>

    <div
      id="forgotMessage"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back-link" href="/admin/">
      ← Back to Admin Login
    </a>

    <p class="footer">
      RK Choco<br>
      Chocolate Distribution Management System
    </p>
  </main>

  <script src="/admin/forgot.js"></script>
</body>
</html>
