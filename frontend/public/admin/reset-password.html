
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4b241b">

  <title>RK Choco | Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      font-family: Arial, Helvetica, sans-serif;
      color: #352019;
      background:
        radial-gradient(circle at top left, #f5dfc6 0, transparent 38%),
        linear-gradient(135deg, #fff9f1, #f0e0d0);
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      border: 1px solid #ead9cc;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(75, 36, 27, 0.13);
    }

    .brand-mark {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, #75402d, #482219);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    h1 {
      margin: 0;
      color: #4b241b;
      text-align: center;
      font-size: 28px;
    }

    .brand-subtitle {
      margin: 9px 0 30px;
      color: #897267;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 25px;
      color: #817168;
      font-size: 14px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #493127;
      font-size: 13px;
      font-weight: 700;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 13px 52px 13px 14px;
      border: 1px solid #dfcfc3;
      border-radius: 10px;
      outline: none;
      background: #fffdfa;
      color: #352019;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #75402d;
      box-shadow: 0 0 0 3px rgba(117, 64, 45, 0.1);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 7px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #704735;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: #f6eee8;
    }

    .toggle-password svg {
      width: 21px;
      height: 21px;
    }

    .hint {
      margin: 7px 0 0;
      color: #817168;
      font-size: 12px;
      line-height: 1.5;
    }

    .submit-button {
      width: 100%;
      min-height: 49px;
      margin-top: 7px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #75402d, #482219);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.93;
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      color: #216c3b;
      background: #edf9f0;
      border: 1px solid #c6e9cf;
    }

    .message.error {
      display: block;
      color: #a32626;
      background: #fff0ee;
      border: 1px solid #f2c7c1;
    }

    .back-link {
      display: block;
      margin-top: 24px;
      color: #75402d;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .footer {
      margin: 25px 0 0;
      color: #958276;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand-mark">RK</div>

    <h1>RK Choco</h1>
    <p class="brand-subtitle">PREMIUM CHOCOLATE DISTRIBUTOR</p>

    <h2>Reset Password</h2>

    <p class="description">
      Create a new secure password for your administrator account.
    </p>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Enter new password"
            minlength="12"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="newPassword"
            aria-label="Show new password"
            aria-pressed="false"
            title="Show password"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <p class="hint">
          Use at least 12 characters.
        </p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter new password"
            minlength="12"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword"
            aria-label="Show confirm password"
            aria-pressed="false"
            title="Show password"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button
        type="submit"
        id="updateButton"
        class="submit-button"
      >
        Update Password
      </button>
    </form>

    <div
      id="resetMessage"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back-link" href="/admin/">
      ← Back to Admin Login
    </a>

    <p class="footer">
      RK Choco<br>
      Chocolate Distribution Management System
    </p>
  </main>

  <script src="/admin/reset.js"></script>
</body>
</html>
